  - folagorlives
  - vicens

# Solo clips de estos juegos (nombre exacto en Twitch). Si no se encuentra, no se filtra.
games:
  - Grand Theft Auto VI

selection:
  window_hours: 3        # buscar clips creados en las últimas N horas
  min_views: 30          # vistas mínimas del clip en Twitch
  min_duration: 12       # segundos (menos de esto no se entiende qué pasa)
  max_per_run: 5         # clips procesados por vuelta (cada ~90 s)
  stream_viewers_factor: 50  # clip nuevo sin vistas aún: vale si el directo tiene >= 50x las vistas mínimas
  boost: {djmariio: 10}  # prioridad al ordenar: sus clips casi no suman vistas y sin esto nunca llegaban arriba
  # Españoles primero (lo que mejor funciona en las cuentas): sus clips van siempre delante en la cola.
  priority: [illojuan, auronplay, pereira7, djmariio, rubius, ibai, thegrefg, elxokas, vegetta777, alexby11, folagorlives, vicens]
  streamer_min_views: {djmariio: 2, illojuan: 2, auronplay: 2, pereira7: 2}   # su chat no ve los clips durante el directo: casi todos tienen 2 vistas
  streamer_max_per_hour: {}   # sin tope por streamer (antes: {djmariio: 5, "*": 4})
  max_per_hour: 1000       # tope de vídeos enviados a Telegram por hora (se envían los que más rápido suben)
  min_score: 4           # nota mínima (1-10) que da la IA para enviarlo
  # Entre estas horas (UTC) se clipea a CUALQUIER streamer que juegue GTA VI en los idiomas de global_min_views.
  # Desde el 18/11 14:30: solo hispanohablantes (es lo que funciona en las cuentas).
  global_from: "2026-11-18T11:00:00Z"   # 12:00 en España = desbloqueo en Nueva Zelanda
  global_until: "2026-12-31T23:00:00Z"
  # Vistas mínimas por idioma del directo (solo se cogen estos idiomas). Lo que no es español se subtitula.
  # Para volver a todo el mundo: {es: 80, en: 300, ja: 60, ko: 60, zh: 60, ru: 80, pt: 100, fr: 80, de: 80, it: 60, pl: 60, tr: 60}
  global_min_views: {es: 40}
  # Clips pedidos directamente a cada directo grande en estos idiomas (su público casi no ve clips).
  live: {langs: [es], min_viewers: 1000, clip_min_views: 3}

# Todos los clips con la cara del streamer arriba y el juego abajo (si se le ve en cámara). false = formato de siempre.
facecam: true
# Detección automática de la cara: se equivoca con personajes del juego quietos. Mejor recuadros a mano.
facecam_auto: false
