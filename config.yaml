# Solo clips de estos juegos (nombre exacto en Twitch). Si no se encuentra, no se filtra.
games:
  - Grand Theft Auto VI

selection:
  window_hours: 3        # buscar clips creados en las últimas N horas
  min_views: 30          # vistas mínimas del clip en Twitch
  min_duration: 12       # segundos (menos de esto no se entiende qué pasa)
  max_per_run: 3         # clips procesados por vuelta (cada ~90 s)
  max_per_hour: 20       # tope de vídeos enviados a Telegram por hora (se envían los que más rápido suben)
  min_score: 4           # nota mínima (1-10) que da la IA para enviarlo
  # Entre estas horas (UTC) se clipea a CUALQUIER streamer que juegue GTA VI, con subtítulos traducidos.
  # 2026-11-18T23:00Z = 00:00 del 19 en España (cuando el juego llega a España). Después, solo la lista de arriba.
  global_from: "2026-11-18T11:00:00Z"   # 12:00 en España = desbloqueo en Nueva Zelanda
  global_until: "2026-11-18T23:00:00Z"
  # Vistas mínimas por idioma del directo (solo se cogen estos idiomas). Todo se subtitula al español.
  # LANZAMIENTO (12:00-13:00): tope 20/h y vistas a la mitad. Volver a 10/h y {es: 80, en: 300, ja: 60, ko: 60, zh: 60, ru: 80, pt: 100, fr: 80, de: 80, it: 60, pl: 60, tr: 60}
  global_min_views: {es: 40, en: 150, ja: 30, ko: 30, zh: 30, ru: 40, pt: 50, fr: 40, de: 40, it: 30, pl: 30, tr: 30}

brand:
  handle: "@mundolibregt6"
  color: "FFD400"        # color de marca (hex RGB) para el gancho y la palabra activa
  font: "Anton"
  hashtags: ["#gta6", "#gtavi", "#mundolibregt6", "#streamers", "#clips"]

groq:
  transcribe_model: whisper-large-v3
  llm_model: openai/gpt-oss-120b
