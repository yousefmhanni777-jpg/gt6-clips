name: clips

on:
  schedule:
    # Cada ejecución hace un bucle de ~55 min revisando Twitch cada 90 s; el cron solo la relanza.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      clip:
        description: "URL de un clip de Twitch concreto (opcional)"
        required: false

concurrency:
  group: clips
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLIP_URL: ${{ github.event.inputs.clip }}
        run: |
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          save() { git add state.json; git diff --cached --quiet || { git commit -qm "estado" && git pull -q --rebase && git push -q; } || true; }
          if [ -n "$CLIP_URL" ]; then
            python pipeline.py --clip "$CLIP_URL"; save; exit 0
          fi
          end=$((SECONDS + 55 * 60))
          while [ $SECONDS -lt $end ]; do
            git pull -q --rebase || true   # recoge cambios de config.yaml sin esperar a la siguiente ejecución
            python pipeline.py || echo "fallo en esta vuelta, sigo"
            save
            sleep 90
          done
