name: clips

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      clip:
        description: "URL de un clip de Twitch concreto (opcional)"
        required: false

concurrency:
  group: clips
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLIP_URL: ${{ github.event.inputs.clip }}
        run: |
          if [ -n "$CLIP_URL" ]; then
            python pipeline.py --clip "$CLIP_URL"
          else
            python pipeline.py
          fi

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -qm "estado" && git pull -q --rebase && git push -q)
