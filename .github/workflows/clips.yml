name: clips

on:
  schedule:
    # Cada ejecución hace un bucle de ~55 min revisando Twitch cada 90 s; el cron solo la relanza.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      clip:
        description: "URL de un clip de Twitch concreto (opcional)"
        required: false

concurrency:
  group: clips
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # para relanzarse a sí mismo al terminar el bucle

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Hora de inicio
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          # ffmpeg ya compilado (segundos) si trae libass para los subtítulos; si no, el de Ubuntu (hasta 15 min)
          FF="$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin"
          if curl -sfL --max-time 120 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP" \
             && "$FF/ffmpeg" -hide_banner -filters | grep -q " ass " \
             && "$FF/ffmpeg" -hide_banner -encoders | grep -q libx264; then
            echo "$FF" >> "$GITHUB_PATH"; echo "ffmpeg rápido"
          else
            echo "ffmpeg rápido no disponible, uso el de Ubuntu"
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          pip install -q -r requirements.txt
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPLOAD_POST_API_KEY: ${{ secrets.UPLOAD_POST_API_KEY }}
          CLIP_URL: ${{ github.event.inputs.clip }}
        run: |
          git config user.name "clips-bot"
          git config user.email "clips-bot@users.noreply.github.com"
          save() { git add state.json; git diff --cached --quiet || { git commit -qm "estado" && git pull -q --rebase && git push -q; } || true; }
          if [ -n "$CLIP_URL" ]; then
            python pipeline.py --clip "$CLIP_URL"; save; exit 0
          fi
          # El bucle acaba a los 62 min del inicio del job (con margen antes del límite de 75),
          # aunque instalar dependencias tarde: así GitHub nunca lo corta a mitad de un clip.
          end=$((T0 + 62 * 60))
          while [ $(date +%s) -lt $end ]; do
            git pull -q --rebase || true   # recoge cambios de config.yaml sin esperar a la siguiente ejecución
            python pipeline.py || echo "fallo en esta vuelta, sigo"
            save
            sleep 90
          done

      - name: Relanzar el bucle
        if: always() && github.event.inputs.clip == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run clips.yml --ref main
