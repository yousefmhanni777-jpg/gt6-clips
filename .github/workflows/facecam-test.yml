name: prueba-cara-arriba

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Cuántos de los últimos clips enviados rehacer"
        default: "8"
      clip:
        description: "O la URL de un clip concreto (opcional)"
        required: false
      debug:
        description: "URLs separadas por comas: solo guarda fotogramas con la cámara detectada (artefacto)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          FF="$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin"
          if curl -sfL --max-time 120 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP" \
             && "$FF/ffmpeg" -hide_banner -filters | grep -q " ass "; then
            echo "$FF" >> "$GITHUB_PATH"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          fi
          pip install -q -r requirements.txt "opencv-python-headless<5"   # OpenCV 5 sacó los detectores Haar del paquete base
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Prueba
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          N: ${{ github.event.inputs.n }}
          CLIP_URL: ${{ github.event.inputs.clip }}
          DEBUG_URLS: ${{ github.event.inputs.debug }}
        run: |
          if [ -n "$DEBUG_URLS" ]; then python facecam.py --debug "$DEBUG_URLS"; exit 0; fi
          if [ -n "$CLIP_URL" ]; then python facecam.py --clip "$CLIP_URL"; else python facecam.py --n "${N:-8}"; fi

      - uses: actions/upload-artifact@v4
        if: github.event.inputs.debug != ''
        with:
          name: debug
          path: out/debug_*.jpg
