name: recopilacion-semanal

on:
  schedule:
    - cron: "0 9 * * 0"   # domingos 10:00 (hora de España)
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás"
        default: "7"
      top:
        description: "Número de clips"
        default: "10"
      cat:
        description: "Categoría"
        type: choice
        options: [bug, curiosidad, todo]
        default: todo

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Domingo: las tres recopilaciones. Manual: solo la elegida.
        cat: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.cat) || '["bug","curiosidad","todo"]') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependencias
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt
          mkdir -p fonts
          curl -sfL -o fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf

      - name: Recopilación
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ github.event.inputs.days || '7' }}
          TOP: ${{ github.event.inputs.top || '10' }}
          CAT: ${{ matrix.cat }}
        run: python compile.py --cat "$CAT" --days "$DAYS" --top "$TOP"
